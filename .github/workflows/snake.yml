name: Generate Snake

# Generates the contribution-graph snake animation and publishes the SVGs to the
# `output` branch, which the README references via raw.githubusercontent.com.
on:
  schedule:
    # Twice a day so the snake stays reasonably fresh.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=C9A227&color_dots=0B1F3A,1e3a5f,2d5a8a,3d7ab8,C9A227

      # Push dist/ to the `output` branch. This MUST match the README's snake path
      # (.../output/github-contribution-grid-snake.svg).
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
