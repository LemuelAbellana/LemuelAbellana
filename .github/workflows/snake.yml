name: Generate Snake

# Generates the contribution-graph snake animation and publishes the SVGs to the
# `output` branch, which the README references via raw.githubusercontent.com.
on:
  schedule:
    # Twice a day so the snake stays reasonably fresh.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230B1F3A&color_dots=%23ebedf0,%23d4bb5e,%23C9A227,%23a8811d,%237a5e14
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23C9A227&color_dots=%23161b22,%235c4a12,%23997d1a,%23b8941f,%23C9A227

      # Push dist/ to the `output` branch. This MUST match the README's snake path
      # (.../output/github-contribution-grid-snake.svg).
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
